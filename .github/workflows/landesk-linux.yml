---
name: LanDesk Linux
'on':
  workflow_call:
permissions:
  contents: read
env:
  RUST_VERSION: '1.82'
  MAC_RUST_VERSION: '1.82'
  FLUTTER_VERSION: 3.44.1
  ANDROID_FLUTTER_VERSION: 3.44.1
  CARGO_NDK_VERSION: 3.1.2
  NDK_VERSION: r28c
  LLVM_VERSION: 15.0.6
  VCPKG_COMMIT_ID: 9e593bb18ea69cc5095e012465dcd675a822ed0d
  VERSION: 1.5.1
  CARGO_BUILD_JOBS: '2'
jobs:
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
    - name: Checkout source code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        submodules: recursive
    - name: Install Linux dependencies
      run: |-
        sudo apt-get update
        sudo apt-get install -y clang cmake libclang-dev llvm-dev nasm ninja-build pkg-config libgtk-3-dev libayatana-appindicator3-dev libasound2-dev libpulse-dev libpam0g-dev libxdo-dev libxfixes-dev libxcb-randr0-dev libxcb-shape0-dev libxcb-xfixes0-dev libva-dev libvdpau-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libunwind-dev libwayland-dev libegl1-mesa-dev libgbm-dev libdrm-dev libsystemd-dev libxkbcommon-dev xvfb
    - name: Restore bridge files
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: landesk-bridge
        path: "./"
    - name: Install flutter
      id: flutter
      uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225
      with:
        channel: stable
        flutter-version: "${{ env.FLUTTER_VERSION }}"
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
      with:
        toolchain: "${{ env.RUST_VERSION }}"
        targets: x86_64-unknown-linux-gnu
        components: rustfmt
    - name: Setup vcpkg with Github Actions binary cache
      uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2
      with:
        vcpkgDirectory: "/opt/artifacts/vcpkg"
        vcpkgGitCommitId: "${{ env.VCPKG_COMMIT_ID }}"
        doNotCache: false
    - name: Install vcpkg dependencies
      run: $VCPKG_ROOT/vcpkg install --triplet x64-linux --x-install-root="$VCPKG_ROOT/installed"
      shell: bash
    - name: Build and package Linux preview
      run: |
        cargo build --locked --release --lib --features flutter,hwcodec,unix-file-copy-paste
        cd flutter
        flutter build linux --release
        cd ..
        test -x flutter/build/linux/x64/release/bundle/landesk
        tar -czf landesk-1.5.1-linux-x86_64.tar.gz -C flutter/build/linux/x64/release/bundle .
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: landesk-linux-x86_64
        path: landesk-*.tar.gz
        if-no-files-found: error
