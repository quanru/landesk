---
name: LanDesk macos
'on':
  workflow_call:
permissions:
  contents: read
env:
  RUST_VERSION: '1.82'
  MAC_RUST_VERSION: '1.82'
  FLUTTER_VERSION: 3.44.1
  ANDROID_FLUTTER_VERSION: 3.44.1
  CARGO_NDK_VERSION: 3.1.2
  NDK_VERSION: r28c
  LLVM_VERSION: 15.0.6
  VCPKG_COMMIT_ID: 9e593bb18ea69cc5095e012465dcd675a822ed0d
  VERSION: 1.5.1
  CARGO_BUILD_JOBS: '2'
jobs:
  macos:
    name: "${{ matrix.job.target }}"
    runs-on: "${{ matrix.job.os }}"
    strategy:
      fail-fast: false
      matrix:
        job:
        - target: x86_64-apple-darwin
          os: macos-15-intel
          extra-build-args: ''
          arch: x86_64
          vcpkg-triplet: x64-osx
        - target: aarch64-apple-darwin
          os: macos-14
          extra-build-args: "--screencapturekit"
          arch: aarch64
          vcpkg-triplet: arm64-osx
    steps:
    - name: Checkout source code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        submodules: recursive
    - name: Install build runtime
      run: |
        brew install llvm create-dmg
        # pkg-config is handled in a separate step, because it may be already installed by `macos-latest`(14.7.1) runner
        if command -v pkg-config &>/dev/null; then
            echo "pkg-config is already installed"
        else
            brew install pkg-config
        fi
    - name: Install NASM
      run: |
        # Install NASM 2.16.x from official release.
        # Do NOT use `brew install nasm` which installs NASM 3.x.
        # NASM 3.x is a complete rewrite with incompatible CLI options and removed features.
        # aom and other multimedia libraries require NASM 2.x for x86/x86_64 assembly.
        wget https://www.nasm.us/pub/nasm/releasebuilds/2.16.03/macosx/nasm-2.16.03-macosx.zip
        unzip nasm-2.16.03-macosx.zip
        sudo cp nasm-2.16.03/nasm /usr/local/bin/nasm
        nasm --version
    - name: Install flutter
      uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
      with:
        channel: stable
        flutter-version: "${{ env.FLUTTER_VERSION }}"
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
      with:
        toolchain: "${{ env.MAC_RUST_VERSION }}"
        targets: "${{ matrix.job.target }}"
        components: rustfmt
    - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      with:
        prefix-key: "${{ matrix.job.os }}"
    - name: Restore bridge files
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: landesk-bridge
        path: "./"
    - name: Setup vcpkg with Github Actions binary cache
      uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2
      with:
        vcpkgGitCommitId: "${{ env.VCPKG_COMMIT_ID }}"
        doNotCache: false
    - name: Install vcpkg dependencies
      run: |
        if ! $VCPKG_ROOT/vcpkg \
          install \
          --x-install-root="$VCPKG_ROOT/installed"; then
          find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
            echo "$_1:"
            echo "======"
            cat "$_1"
            echo "======"
            echo ""
          done
          exit 1
        fi
        head -n 100 "${VCPKG_ROOT}/buildtrees/ffmpeg/build-${{ matrix.job.vcpkg-triplet }}-rel-out.log" || true
    - name: Show version information (Rust, cargo, Clang)
      shell: bash
      run: |
        clang --version || true
        rustup -V
        rustup toolchain list
        rustup default
        cargo -V
        rustc -V
    - name: Build landesk
      run: |
        export MACOSX_DEPLOYMENT_TARGET=12.3
        cargo build --locked --release --lib --bin service --features flutter,hwcodec,unix-file-copy-paste
        cp target/release/liblibrustdesk.dylib target/release/librustdesk.dylib
        cd flutter
        FLUTTER_XCODE_ARCHS="$(uname -m)" FLUTTER_XCODE_ONLY_ACTIVE_ARCH=YES FLUTTER_XCODE_CODE_SIGNING_ALLOWED=NO flutter build macos --release
        cd ..
        cp target/release/service flutter/build/macos/Build/Products/Release/LanDesk.app/Contents/MacOS/
        ditto -c -k --sequesterRsrc --keepParent flutter/build/macos/Build/Products/Release/LanDesk.app landesk-1.5.1-macos-${{ matrix.job.arch }}-unsigned.zip
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: landesk-macos-${{ matrix.job.arch }}-unsigned
        path: landesk-*.zip
        if-no-files-found: error
    timeout-minutes: 120
