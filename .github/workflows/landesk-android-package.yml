---
name: Repackage LanDesk Android native preview
'on':
  workflow_dispatch:
    inputs:
      run-id:
        type: string
        required: true
        description: Original build run containing native libraries
      source-sha:
        type: string
        required: true
        description: Exact source commit from original build
permissions:
  contents: read
  actions: read
env:
  RUST_VERSION: '1.82'
  MAC_RUST_VERSION: '1.82'
  FLUTTER_VERSION: 3.44.1
  ANDROID_FLUTTER_VERSION: 3.44.1
  CARGO_NDK_VERSION: 3.1.2
  NDK_VERSION: r28c
  LLVM_VERSION: 15.0.6
  VCPKG_COMMIT_ID: 9e593bb18ea69cc5095e012465dcd675a822ed0d
  VERSION: 1.5.1
  CARGO_BUILD_JOBS: '2'
  ANDROID_SIGNING_CERT_SHA256: "${{ secrets.ANDROID_SIGNING_CERT_SHA256 }}"
jobs:
  android:
    name: Build landesk android apk ${{ matrix.job.target }}
    runs-on: "${{ matrix.job.os }}"
    strategy:
      fail-fast: false
      matrix:
        job:
        - arch: aarch64
          target: aarch64-linux-android
          os: ubuntu-24.04
          reltype: release
          suffix: ''
        - arch: armv7
          target: armv7-linux-androideabi
          os: ubuntu-24.04
          reltype: release
          suffix: ''
        - arch: x86_64
          target: x86_64-linux-android
          os: ubuntu-24.04
          reltype: release
          suffix: ''
    steps:
    - name: Checkout source code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        submodules: recursive
        ref: "${{ inputs.source-sha }}"
    - name: Install flutter
      uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
      with:
        channel: stable
        flutter-version: "${{ env.ANDROID_FLUTTER_VERSION }}"
    - uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779
      id: setup-ndk
      with:
        ndk-version: "${{ env.NDK_VERSION }}"
        add-to-path: true
    - name: Restore bridge files
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: landesk-bridge
        path: "./"
        run-id: "${{ inputs.run-id }}"
        github-token: "${{ github.token }}"
    - name: Restore verified-source native core
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: librustdesk.so.${{ matrix.job.target }}
        path: target/${{ matrix.job.target }}/release
        run-id: "${{ inputs.run-id }}"
        github-token: "${{ github.token }}"
    - name: Build landesk
      shell: bash
      env:
        JAVA_HOME: "/usr/lib/jvm/java-17-openjdk-amd64"
      run: |
        export PATH=/usr/lib/jvm/java-17-openjdk-amd64/bin:$PATH
        # Increase Gradle JVM memory for CI builds
        sed -i "s/org.gradle.jvmargs=-Xmx1024M/org.gradle.jvmargs=-Xmx2g/g" ./flutter/android/gradle.properties
        # Use a temporary build signature; the APK is re-signed and fingerprint-verified below.
        sed -i "s/signingConfigs.release/signingConfigs.debug/g" ./flutter/android/app/build.gradle
        case ${{ matrix.job.target }} in
          aarch64-linux-android)
            mkdir -p ./flutter/android/app/src/main/jniLibs/arm64-v8a
            cp ${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so ./flutter/android/app/src/main/jniLibs/arm64-v8a/
            cp ./target/${{ matrix.job.target }}/release/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/arm64-v8a/librustdesk.so
            # build flutter
            pushd flutter
            flutter build apk "--${{ matrix.job.reltype }}" --target-platform android-arm64 --split-per-abi
            mv build/app/outputs/flutter-apk/app-arm64-v8a-${{ matrix.job.reltype }}.apk ../landesk-${{ env.VERSION }}-${{ matrix.job.arch }}${{ matrix.job.suffix }}.apk
          ;;
          armv7-linux-androideabi)
            mkdir -p ./flutter/android/app/src/main/jniLibs/armeabi-v7a
            cp ${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/arm-linux-androideabi/libc++_shared.so ./flutter/android/app/src/main/jniLibs/armeabi-v7a/
            cp ./target/${{ matrix.job.target }}/release/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/armeabi-v7a/librustdesk.so
            # build flutter
            pushd flutter
            flutter build apk "--${{ matrix.job.reltype }}" --target-platform android-arm --split-per-abi
            mv build/app/outputs/flutter-apk/app-armeabi-v7a-${{ matrix.job.reltype }}.apk ../landesk-${{ env.VERSION }}-${{ matrix.job.arch }}${{ matrix.job.suffix }}.apk
          ;;
          x86_64-linux-android)
            mkdir -p ./flutter/android/app/src/main/jniLibs/x86_64
            cp ${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/x86_64-linux-android/libc++_shared.so ./flutter/android/app/src/main/jniLibs/x86_64/
            cp ./target/${{ matrix.job.target }}/release/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/x86_64/librustdesk.so
            # build flutter
            pushd flutter
            flutter build apk "--${{ matrix.job.reltype }}" --target-platform android-x64 --split-per-abi
            mv build/app/outputs/flutter-apk/app-x86_64-${{ matrix.job.reltype }}.apk ../landesk-${{ env.VERSION }}-${{ matrix.job.arch }}${{ matrix.job.suffix }}.apk
          ;;
          i686-linux-android)
            mkdir -p ./flutter/android/app/src/main/jniLibs/x86
            cp ${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/i686-linux-android/libc++_shared.so ./flutter/android/app/src/main/jniLibs/x86/
            cp ./target/${{ matrix.job.target }}/release/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/x86/librustdesk.so
            # build flutter
            pushd flutter
            flutter build apk "--${{ matrix.job.reltype }}" --target-platform android-x86 --split-per-abi
            mv build/app/outputs/flutter-apk/app-x86-${{ matrix.job.reltype }}.apk ../landesk-${{ env.VERSION }}-${{ matrix.job.arch }}${{ matrix.job.suffix }}.apk
          ;;
        esac
        popd
        mkdir -p signed-apk; pushd signed-apk
        mv ../landesk-${{ env.VERSION }}-${{ matrix.job.arch }}${{ matrix.job.suffix }}.apk .
    - name: Setup sign tool version variable
      shell: bash
      run: |
        BUILD_TOOL_VERSION=$(ls /usr/local/lib/android/sdk/build-tools/ | tail -n 1)
        echo "ANDROID_SIGN_TOOL_VERSION=$BUILD_TOOL_VERSION" >> $GITHUB_ENV
        echo Last build tool version is: $BUILD_TOOL_VERSION
    - name: Require fixed Android signing identity for releases
      shell: bash
      env:
        ANDROID_SIGNING_KEY: "${{ secrets.ANDROID_SIGNING_KEY }}"
        ANDROID_ALIAS: "${{ secrets.ANDROID_ALIAS }}"
        ANDROID_KEY_STORE_PASSWORD: "${{ secrets.ANDROID_KEY_STORE_PASSWORD }}"
        ANDROID_KEY_PASSWORD: "${{ secrets.ANDROID_KEY_PASSWORD }}"
      run: |
        for value in \
          "$ANDROID_SIGNING_KEY" \
          "$ANDROID_ALIAS" \
          "$ANDROID_KEY_STORE_PASSWORD" \
          "$ANDROID_KEY_PASSWORD" \
          "$ANDROID_SIGNING_CERT_SHA256"
        do
          if [ -z "$value" ]; then
            echo "Android release signing secrets are incomplete; refusing to publish." >&2
            exit 1
          fi
        done
    - uses: r0adkll/sign-android-release@349ebdef58775b1e0d8099458af0816dc79b6407
      name: Sign app APK
      id: sign-rustdesk
      with:
        releaseDirectory: "./signed-apk"
        signingKeyBase64: "${{ secrets.ANDROID_SIGNING_KEY }}"
        alias: "${{ secrets.ANDROID_ALIAS }}"
        keyStorePassword: "${{ secrets.ANDROID_KEY_STORE_PASSWORD }}"
        keyPassword: "${{ secrets.ANDROID_KEY_PASSWORD }}"
      env:
        BUILD_TOOLS_VERSION: "${{ env.ANDROID_SIGN_TOOL_VERSION }}"
    - name: Verify fixed Android signing certificate
      shell: bash
      env:
        SIGNED_APK: "${{ steps.sign-rustdesk.outputs.signedReleaseFile }}"
      run: |
        expected=$(printf '%s' "$ANDROID_SIGNING_CERT_SHA256" | tr '[:lower:]' '[:upper:]' | tr -d ': ')
        if ! printf '%s' "$expected" | grep -Eq '^[0-9A-F]{64}$'; then
          echo "ANDROID_SIGNING_CERT_SHA256 must contain one SHA-256 certificate fingerprint." >&2
          exit 1
        fi
        actual=$("$ANDROID_HOME/build-tools/$ANDROID_SIGN_TOOL_VERSION/apksigner" verify --print-certs "$SIGNED_APK" \
          | sed -n -E 's/^.*certificate SHA-256 digest:[[:space:]]*([0-9A-Fa-f]{64})[[:space:]]*$//p' | head -n 1 \
          | tr '[:lower:]' '[:upper:]' \
          | tr -d ': ')
        if [ "$actual" != "$expected" ]; then
          echo "Android signing certificate does not match the pinned fingerprint." >&2
          echo "Expected: $expected" >&2
          echo "Actual:   $actual" >&2
          exit 1
        fi
    - name: Upload Artifacts
      if: "${{ success() }}"
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: landesk-${{ env.VERSION }}-${{ matrix.job.arch }}.apk
        path: "${{steps.sign-rustdesk.outputs.signedReleaseFile}}"
        if-no-files-found: error
    timeout-minutes: 40
    needs: provenance
  provenance:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410
      env:
        BUILD_RUN_ID: "${{ inputs.run-id }}"
        SOURCE_SHA: "${{ inputs.source-sha }}"
      with:
        script: |
          const {data: run} = await github.rest.actions.getWorkflowRun({owner: context.repo.owner, repo: context.repo.repo, run_id: Number(process.env.BUILD_RUN_ID)});
          if (run.head_sha !== process.env.SOURCE_SHA || run.path !== '.github/workflows/landesk-preview.yml') throw new Error('Unexpected source build');
